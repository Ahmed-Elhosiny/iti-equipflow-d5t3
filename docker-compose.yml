version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: equipflow-db
    environment:
      POSTGRES_USER: equipflow
      POSTGRES_PASSWORD: equipflow_password
      POSTGRES_DB: equipflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipflow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=equipflow;Username=equipflow;Password=equipflow_password
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: equipflow-db
    environment:
      POSTGRES_USER: equipflow
      POSTGRES_PASSWORD: equipflow_password
      POSTGRES_DB: equipflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipflow -d equipflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NEW: Canonical Ollama service for offline-first embeddings
  ollama:
    image: ollama/ollama:latest
    container_name: equipflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # NEW: Init container to pull the required 1024-dim model
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama server to start..."
        sleep 5
        echo "Pulling mxbai-embed-large (1024 dims)..."
        ollama pull mxbai-embed-large
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipflow-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=equipflow;Username=equipflow;Password=equipflow_password
      # FIXED: Point to the internal Ollama service, not host.docker.internal
      Llm__Ollama__BaseUrl: http://ollama:11434
      Llm__Ollama__EmbeddingModel: mxbai-embed-large
      DefaultLlmProvider: Ollama
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s # Increased to allow Ollama model loading time
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipflow-seed
    env_file:
      - .env
    command: ["--seed"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=equipflow;Username=equipflow;Password=equipflow_password
      Llm__Ollama__BaseUrl: http://ollama:11434
      SEED_MODE: "true"
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    profiles:
      - tools

volumes:
  postgres_data:
  ollama_data:
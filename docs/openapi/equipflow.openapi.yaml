openapi: 3.0.3
info:
  title: EquipFlow — Industrial Maintenance Copilot API
  description: |
    HTTP API for EquipFlow (ITI D5T3).
    Covers: grounded RAG chat, controlled tools, the D5 three-agent workflow,
    the structural safety gate, Supervisor approval (incl. edit-and-approve),
    the gated dispatch write tool, the T3 Cost Governor spend view, and observability.
    Every response carries `X-Correlation-Id` (OBS-001).
  version: 1.1.0
  contact:
    name: EquipTech Manufacturing
servers:
  - url: http://localhost:5000
    description: Local development (docker compose up)

tags:
  - name: Auth
  - name: Equipment
  - name: Maintenance
  - name: Documents
  - name: Search
  - name: Chat
    description: Conversational AI entry point (Orchestrator)
  - name: AI
    description: Full D5 Agentic Workflow
  - name: Conversations
    description: Session history (FR-007)
  - name: WorkOrders
    description: D5 workflow, safety gate, approval gate, dispatch
  - name: CostGovernor
    description: T3 spend view and budget
  - name: Observability
    description: Run traces and cancellation
  - name: Health

security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and obtain a JWT
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/equipment:
    get:
      tags: [Equipment]
      summary: List authorised equipment (FR-004)
      operationId: listEquipment
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: line
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Equipment list
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Equipment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/equipment/{id}:
    get:
      tags: [Equipment]
      summary: Get equipment details (FR-005)
      operationId: getEquipment
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Equipment details
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Equipment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/equipment/{id}/maintenance:
    get:
      tags: [Maintenance]
      summary: Retrieve authorised maintenance history (FR-006, TL-002)
      operationId: getMaintenanceHistory
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Maintenance events
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaintenanceEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/documents:
    get:
      tags: [Documents]
      summary: List ingested documents
      operationId: listDocuments
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      responses:
        '200':
          description: Documents
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentMeta' }
    post:
      tags: [Documents]
      summary: Upload a document for ingestion (FR-007, Manager role)
      operationId: uploadDocument
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF or DOCX
                type:
                  type: string
                  enum: [Manual, MaintenanceGuide, TroubleshootingGuide, SafetyProcedure, SOP, MaintenanceReport]
                source: { type: string }
                section: { type: string }
                version: { type: string }
                format: { type: string, enum: [PDF, DOCX] }
      responses:
        '201':
          description: Ingestion queued (idempotent re-ingestion, FR-010)
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/search:
    post:
      tags: [Search]
      summary: Search maintenance knowledge base using hybrid retrieval (ADR-005)
      operationId: searchDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: Search results with citations or structured refusal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }

  /api/chat:
    post:
      tags: [Chat]
      summary: |
        Conversational AI entry point (Orchestrator).
        Returns Server-Sent Events (SSE) with token-level streaming and live
        agent progress events (NFR-003).
      operationId: chat
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: SSE stream of progress + answer events
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            text/event-stream:
              schema:
                type: string
        '402':
          description: Budget exhausted — hard cut-off (CG-004, CG-009)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetRefusalDto' }

  /api/ai/analyze:
    post:
      tags: [AI]
      summary: Run the full D5 maintenance analysis workflow (FR-021...FR-024)
      operationId: analyzeMaintenance
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyzeMaintenanceRequest' }
      responses:
        '200':
          description: Workflow completed (PendingApproval, PartialSuccess, or Cached)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyzeMaintenanceResponse' }
        '402':
          description: Budget exhausted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetRefusalDto' }
        '422':
          description: Workflow failed

  /api/conversations:
    get:
      tags: [Conversations]
      summary: Get the authenticated user's conversations (FR-007)
      operationId: getMyConversations
      responses:
        '200':
          description: Conversations list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversationSummary' }
    post:
      tags: [Conversations]
      summary: Start a new conversation
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartConversationRequest' }
      responses:
        '201':
          description: Conversation created

  /api/conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get a specific conversation with its messages
      operationId: getConversationById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/workorders:
    get:
      tags: [WorkOrders]
      summary: Get the authenticated user's work orders
      operationId: getWorkOrdersByUser
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WorkOrderStatus' }
      responses:
        '200':
          description: Work orders list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkOrder' }
    post:
      tags: [WorkOrders]
      summary: Create a draft work order
      operationId: createWorkOrder
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkOrderRequest' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { type: string, format: uuid }

  /api/workorders/pending-approvals:
    get:
      tags: [WorkOrders]
      summary: Get work orders pending supervisor approval
      operationId: getPendingWorkOrderApprovals
      security:
        - bearerAuth: [Supervisor]
      responses:
        '200':
          description: Pending work orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkOrder' }

  /api/workorders/{id}:
    get:
      tags: [WorkOrders]
      summary: Get a work order (FR-003 object-level auth)
      operationId: getWorkOrder
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Work order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/workorders/{id}/safety:
    post:
      tags: [WorkOrders]
      summary: Add a safety prerequisite
      operationId: addSafetyPrerequisite
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddSafetyPrerequisiteRequest' }
      responses:
        '204':
          description: Prerequisite added

  /api/workorders/{id}/safety/{pid}/complete:
    post:
      tags: [WorkOrders]
      summary: Mark a safety prerequisite resolved
      operationId: completeSafetyPrerequisite
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: pid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                completionNote: { type: string, nullable: true }
      responses:
        '204':
          description: Prerequisite marked complete

  /api/workorders/{id}/submit:
    post:
      tags: [WorkOrders]
      summary: Submit for Supervisor approval (FR-025)
      operationId: submitWorkOrder
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Transitioned to PendingApproval
        '409':
          description: Unresolved mandatory safety prerequisite blocks submission (FR-026)

  /api/workorders/{id}/approve:
    post:
      tags: [WorkOrders]
      summary: Supervisor approves (FR-027)
      operationId: approveWorkOrder
      security:
        - bearerAuth: [Supervisor]
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderDecisionRequest' }
      responses:
        '204':
          description: Approved (audited, FR-028)

  /api/workorders/{id}/reject:
    post:
      tags: [WorkOrders]
      summary: Supervisor reject (FR-027, audited FR-028)
      operationId: rejectWorkOrder
      security:
        - bearerAuth: [Supervisor]
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderDecisionRequest' }
      responses:
        '204':
          description: Rejected

  /api/workorders/{id}/edit-and-approve:
    post:
      tags: [WorkOrders]
      summary: Edit permitted fields and approve a work order (FR-029)
      operationId: editAndApproveWorkOrder
      security:
        - bearerAuth: [Supervisor]
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderEditAndApproveRequest' }
      responses:
        '204':
          description: Edited and approved

  /api/workorders/{id}/dispatch:
    post:
      tags: [WorkOrders]
      summary: Authorise dispatch — the gated write tool (FR-019, TL-005)
      operationId: dispatchWorkOrder
      security:
        - bearerAuth: [Supervisor]
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Dispatch authorised (Approved → Dispatched)
        '409':
          description: Preconditions not met

  /api/budget/me:
    get:
      tags: [CostGovernor]
      summary: Get the authenticated user's budget
      operationId: getMyBudget
      responses:
        '200':
          description: Budget details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetSummary' }

  /api/budgets/me:
    get:
      tags: [CostGovernor]
      summary: Get the authenticated user's budget (Legacy)
      operationId: getMyBudgetLegacy
      responses:
        '200':
          description: Budget details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetSummary' }

  /api/budgets:
    get:
      tags: [CostGovernor]
      summary: Get all user budgets (Manager only)
      operationId: getAllBudgets
      security:
        - bearerAuth: [Manager]
      responses:
        '200':
          description: All budgets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BudgetSummary' }

  /api/cost/spend:
    get:
      tags: [CostGovernor]
      summary: Spend view (CG-008)
      operationId: getSpend
      responses:
        '200':
          description: Spend view
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageRecord' }

  /api/runs/{runId}:
    get:
      tags: [Observability]
      summary: Inspect an agent run step-by-step (NFR-002, OBS-002)
      operationId: getRunTrace
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Run trace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunTrace' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/runs/{runId}/cancel:
    post:
      tags: [Observability]
      summary: Cancel a running agent run (NFR-004)
      operationId: cancelRun
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Cancellation requested
        '404':
          description: Run not found or not owned by user

  /health:
    get:
      tags: [Health]
      summary: Full health check
      security: []
      operationId: health
      responses:
        '200': { description: Healthy }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (NFR-010)
      security: []
      operationId: readiness
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      operationId: liveness
      responses:
        '200': { description: Alive }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT bearer. Roles: Technician, Engineer, Manager, Supervisor."

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string }

  headers:
    CorrelationId:
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid credentials
    Forbidden:
      description: Authenticated but not permitted
    NotFound:
      description: Resource not found or not accessible

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    TokenResponse:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    Equipment:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        serialNumber: { type: string, nullable: true }
        line: { type: string, nullable: true }

    MaintenanceEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        description: { type: string }

    DocumentMeta:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { type: string }
        status: { type: string }
        uploadedAt: { type: string, format: date-time }

    IngestionStatus:
      type: object
      properties:
        id: { type: string, format: uuid }

    SearchRequest:
      type: object
      required: [queryText]
      properties:
        queryText: { type: string }
        topK: { type: integer, default: 10 }
        equipmentId: { type: string, nullable: true }
        productionLine: { type: string, nullable: true }
        documentType: { type: string, nullable: true }
        documentVersion: { type: string, nullable: true }

    SearchResult:
      type: object
      properties:
        isRefusal: { type: boolean }
        refusalReason: { type: string, nullable: true }
        results:
          type: array
          items:
            type: object
            properties:
              documentId: { type: string, format: uuid }
              chunkId: { type: string, format: uuid }
              content: { type: string }
              score: { type: number }

    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
        conversationId: { type: string, format: uuid, nullable: true }
        equipmentContext: { type: string, nullable: true }
        stream: { type: boolean, default: true }

    AnalyzeMaintenanceRequest:
      type: object
      required: [symptomDescription]
      properties:
        symptomDescription: { type: string }
        equipmentIdHint: { type: string, nullable: true }

    AnalyzeMaintenanceResponse:
      type: object
      properties:
        status: { type: string }
        draft: { $ref: '#/components/schemas/WorkOrderOutput' }
        diagnosticPlan: { $ref: '#/components/schemas/DiagnosticPlanOutput' }
        errorMessage: { type: string, nullable: true }
        reasonCode: { type: string, nullable: true }
        estimatedCost: { type: number, nullable: true }
        remainingBudget: { type: number, nullable: true }
        cachedResponse: { type: string, nullable: true }
        fallbackCitations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }

    WorkOrderOutput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        requiredParts: { type: array, items: { type: string } }
        priority: { type: string }
        workOrderId: { type: string, format: uuid, nullable: true }
        summary: { type: string, nullable: true }
        estimatedCost: { type: number }

    DiagnosticPlanOutput:
      type: object
      properties:
        steps:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              evidenceChunkId: { type: string, nullable: true }
        safetyPrerequisites:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              isMandatory: { type: boolean }
        reasoning: { type: string }

    BudgetRefusalDto:
      type: object
      properties:
        type: { type: string }
        remaining_budget_usd: { type: number }
        estimated_cost_usd: { type: number }
        options: { type: array, items: { type: string } }

    Citation:
      type: object
      properties:
        documentId: { type: string }
        chunkId: { type: string }
        section: { type: string, nullable: true }
        page: { type: integer, nullable: true }
        score: { type: number, format: float }

    ConversationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        createdAt: { type: string, format: date-time }

    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        messages:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              role: { type: string }
              content: { type: string }
              timestamp: { type: string, format: date-time }

    StartConversationRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }

    CreateWorkOrderRequest:
      type: object
      required: [title, symptom, equipmentName]
      properties:
        title: { type: string }
        symptom: { type: string }
        equipmentName: { type: string }
        equipmentAssetNumber: { type: string, nullable: true }
        manualRevision: { type: string, nullable: true }
        location: { type: string, nullable: true }

    AddSafetyPrerequisiteRequest:
      type: object
      required: [description, isMandatory, sortOrder]
      properties:
        description: { type: string }
        isMandatory: { type: boolean }
        sortOrder: { type: integer }

    WorkOrderDecisionRequest:
      type: object
      properties:
        comment: { type: string, nullable: true }

    WorkOrderEditAndApproveRequest:
      type: object
      properties:
        comment: { type: string, nullable: true }
        title: { type: string, nullable: true }
        symptom: { type: string, nullable: true }
        equipmentName: { type: string, nullable: true }
        equipmentAssetNumber: { type: string, nullable: true }
        manualRevision: { type: string, nullable: true }
        location: { type: string, nullable: true }

    WorkOrderStatus:
      type: string
      enum: [Draft, Submitted, Approved, Rejected, Dispatched]

    WorkOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        symptom: { type: string }
        equipmentName: { type: string }
        status: { $ref: '#/components/schemas/WorkOrderStatus' }
        createdBy: { type: string }

    BudgetSummary:
      type: object
      properties:
        userId: { type: string, format: uuid }
        totalLimit: { type: number }
        consumedAmount: { type: number }
        remainingBudget: { type: number }
        nextResetDate: { type: string, format: date-time }

    UsageRecord:
      type: object
      properties:
        runId: { type: string, format: uuid }
        modelId: { type: string }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        costUsd: { type: number }
        timestamp: { type: string, format: date-time }

    RunTrace:
      type: object
      properties:
        correlationId: { type: string, format: uuid }
        status: { type: string }
        startedAt: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            properties:
              eventType: { type: string }
              timestamp: { type: string, format: date-time }
              payload: { type: object }